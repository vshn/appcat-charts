replicas: 3
myCfn: nil
rootPassword: ""
rootPasswordSecretKeyRef: {}
image: nil

storage:
  size: 1Gi
resources: {}

galera:
  enabled: true
  config:
    reuseStorageVolume: true
  providerOptions:
    "gcs.fc_single_primary": "yes"
    "cert.log_conflicts": "yes"
  recovery:
    podSyncTimeout: 30m
    clusterBootstrapTimeout: 30m

startupProbe:
  failureThreshold: 120

metrics:
  enabled: true
  exporter:
    image: nil

backup:
  enabled: false
  maxRetention: 720h # 30 days

tls:
  enabled: true
  required: false
  serverCASecretRef: ""
  serverCertSecretRef: ""

updateStrategy:
  autoUpdateDataPlane: false
